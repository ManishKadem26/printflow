# Netlify hosts only the website (frontend/). The backend runs on Render.
# The backend address goes in frontend/config.js.
[build]
  publish = "frontend"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

# Always fetch the latest backend address
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
